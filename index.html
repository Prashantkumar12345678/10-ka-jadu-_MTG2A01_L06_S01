  const humOff = () => { if(!hum) return; try{ hum.g.gain.setTargetAtTime(0, hum.c.currentTime, .15); const h0 = hum; setTimeout(() => { try{ h0.o.stop(); h0.o2.stop(); }catch(e){} }, 600); }catch(e){} hum = null; };

  let speed = 0, speedTarget = 0, flow = 0, alive = true, last = performance.now(), thinking = false, finish = null;
  const setSpeed = v => { speedTarget = v; humTo(v); };
  const step = now => {
    if(!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    speed += (speedTarget - speed) * Math.min(1, dt * 2.2);
    flow = (flow + speed * 80 * dt) % 512;
    sea.style.backgroundPositionY = flow + "px"; sea.style.setProperty("--flow", (flow % 64) + "px");
    lines.style.opacity = Math.max(0, (speed - 3.5) / 5).toFixed(2);
    lines.style.backgroundPositionY = (flow * 3) + "px";
    if(finish){ finish.y += speed * 80 * dt; finish.el.style.transform = `translateY(${finish.y}px)`; }
    // rivals creep forward while the child is thinking — but never more than a little ahead
    if(thinking) rivals.forEach(r => { r.target = Math.min(r.target + dt * .006, meJ.target + .05, .97); });
    jets.forEach(j => {
      const k = 3.2;                                     // spring toward the target with damping = smooth surge
      j.v += ((j.target - j.p) * k - j.v * 2.4) * dt;
      j.p += j.v * dt;
      j.ph += dt * (1.6 + speed * .25);
      const weave = Math.sin(j.ph) * (4 + speed * .8);
      const dx = weave - (j._w || 0); j._w = weave;
      j.lean += ((dx / Math.max(dt, .001)) * .35 - j.lean) * Math.min(1, dt * 6);
      const y = Y0 - j.p * (Y0 - Y1);
      j.el.style.transform = `translate(${j.x + weave}px,${y}px)`;
      j.img.style.transform = `rotate(${Math.max(-9, Math.min(9, j.lean))}deg)`;
      // spray: more drops the faster the boat goes
      const rate = (speed + Math.max(0, j.v) * 20) * (j === meJ ? 1.4 : .8);
      j._acc = (j._acc || 0) + rate * dt * 6;
      while(j._acc >= 1){ j._acc -= 1; spray(j.x + weave, y + 170, j === meJ && meJ.el.classList.contains("turbo")); }
    });
    requestAnimationFrame(step);
  };
  const spray = (x, y, gold) => {
    if(fx.childElementCount > 140) return;
    const d = el("i", gold ? "gold" : "");
    const ang = (Math.random() - .5) * 1.6, dist = 30 + Math.random() * 60, sz = 5 + Math.random() * 9;
    d.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;--dx:${Math.sin(ang) * dist}px;--dy:${40 + Math.random() * 70}px`;
    fx.appendChild(d); setTimeout(() => d.remove(), 700);
  };
  requestAnimationFrame(step);
  const _kill = f.kill.bind(f); f.kill = () => { alive = false; humOff(); _kill(); };
  const shake = () => { world.classList.remove("shake"); void world.offsetWidth; world.classList.add("shake"); };
  const popText = t => { pop.textContent = t; pop.classList.remove("show"); void pop.offsetWidth; pop.classList.add("show"); };

  const panel = el("div", "jr-panel"); world.appendChild(panel);
  const band = el("div", "jr-band"); panel.appendChild(band);
  const btnRow = el("div", "jr-btns"); panel.appendChild(btnRow);
  const btns = [0, 1, 2].map(() => { const b = el("button", "jr-btn"); btnRow.appendChild(b); return b; });
  const setProg = p => {
    const completed = Math.round(p * questionCount);
    fill.style.width = (p * 100) + "%"; icon.style.left = (p * 100) + "%";
    dots.forEach((d, i) => d.classList.toggle("done", completed >= i + 1));
    bar.setAttribute("aria-valuenow", String(completed));
  };
  setProg(0);
  panel.style.visibility = "hidden";

  /* 3-2-1-GO! */
  const cd = el("div", "jt-count"); world.appendChild(cd);
  for(const t of ["3", "2", "1"]){
    cd.textContent = t; cd.classList.remove("go", "show"); void cd.offsetWidth; cd.classList.add("show");
    beep(520); await f.wait(800);
  }
  cd.textContent = "चलो!"; cd.classList.remove("show"); void cd.offsetWidth; cd.classList.add("show", "go");
  beep(880, .35); vroom(2); setSpeed(2.2);
  jets.forEach(j => { j.target = .03 + Math.random() * .02; });
  await f.wait(700); cd.remove();
  panel.style.visibility = "";

  const qs = RACE_QS.slice().sort(() => Math.random() - .5), total = qs.length;
  voLock(true); await f.say(vo.go); voLock(false);
  let streak = 0;
  for(let qi = 0; qi < total; qi++){
    const q = qs[qi];
    band.innerHTML = "";
    const eq = Equation(band, q.a, q.op, q.b);
    const vals = q.opts.slice().sort(() => Math.random() - .5);
    btns.forEach((b, i) => { b.textContent = vals[i]; b.dataset.v = vals[i]; b.className = "jr-btn"; b.onclick = null; });
    setSpeed(1.6);
    voLock(true); await f.say(q.vo); voLock(false);
    let wrong = 0;
    thinking = true;
    while(true){
      armNudge(eq.box, NUDGE_MS.game);
      const btn = await f.until(done => btns.forEach(o => o.onclick = () => { if(!document.body.classList.contains("vo-lock")) done(o); }));
      disarmNudge();
      if(+btn.dataset.v === q.ans){
        thinking = false;
        btns.forEach(o => o.onclick = null);
        btn.classList.remove("reveal-pulse"); btn.classList.add("correct"); eq.set(q.ans, "done");
        if(wrong === 0) streak++; else streak = 0;
        const lvl = Math.max(1, Math.min(3, streak));                     // 1 small boost · 2 faster · 3 turbo
        sfx("sfx_correct", .6); vroom(lvl);
        setSpeed([0, 4, 5.5, 8.5][lvl]);
        meJ.el.classList.remove("boost", "turbo", "slow"); void meJ.el.offsetWidth;
        meJ.el.classList.add(lvl >= 3 ? "turbo" : "boost");
        meJ.v += .25 + lvl * .12;                                       // a kick forward
        meJ.target = (qi + 1) / total;
        rivals.forEach(r => { r.target = Math.min(r.target, meJ.target * r.pace + Math.random() * .03); });
        setProg(meJ.target);
        turbo.classList.toggle("show", lvl >= 3);
        if(lvl >= 3) shake();
        popText(["", "शाबाश!", "तेज़!", "सुपर तेज़!"][lvl]);
        voLock(true); await f.say(VO_RACE_OK[lvl - 1]); voLock(false);
        await f.wait(900);
        meJ.el.classList.remove("boost", "turbo"); turbo.classList.remove("show");
        break;
      }
      // wrong: the streak breaks, the engine sputters, our jet ski drops back and the others edge past
      wrong++; streak = 0; setSpeed(.7);
      btn.classList.remove("wrong-flash"); void btn.offsetWidth; btn.classList.add("wrong-flash");
      sfx("sfx_wrong", .45); engineDown();
      meJ.el.classList.remove("boost", "turbo", "slow"); void meJ.el.offsetWidth; meJ.el.classList.add("slow");
      meJ.target = Math.max(0, meJ.target - .025); meJ.v -= .15;
      rivals.forEach(r => { r.target = Math.min(r.target + .025, .97); });
      voLock(true);
      await f.wait(700);
      if(wrong === 1){
        btn.classList.remove("wrong-flash"); btn.classList.add("crossed");
        thinking = false;
        const host = showHint(`${q.a} ${q.op === "+" ? "+" : MINUS} ${q.b}`);     // the counters pop out
        if(q.op === "+") await animAdd(f, host, q.a, q.b, VO_RACE_HINT_ADD); else await animSub(f, host, q.a, q.b, VO_RACE_HINT_SUB);
        await f.wait(1200); hideHint();
        await f.wait(400);
        thinking = true;
      } else {
        btn.classList.remove("wrong-flash");
        btns.forEach(o => { if(+o.dataset.v === q.ans) o.classList.add("reveal-pulse"); else o.classList.add("faded"); });
        await f.say(q.voAns);
      }
      setSpeed(1.6);
      voLock(false);
    }
  }
  /* 4. finish: the chequered line sweeps in, our jet ski bursts across it first */
  thinking = false;
  panel.remove();
  const line = el("div", "jt-finish"); world.appendChild(line);
  finish = { el:line, y:-90 };
  setSpeed(8.5); vroom(3); shake();
  meJ.target = 1.08; meJ.v += .6; meJ.el.classList.add("turbo");
  rivals.forEach(r => { r.target = .9 + Math.random() * .06; });
  setProg(1);
  await f.wait(1700);
  setSpeed(1.2); meJ.el.classList.remove("turbo");
  world.appendChild(el("div", "jr-win", "आप जीत गए! 🏆"));
  sfx("sfx_celebrate", .7); confettiCannon();
  voLock(true); await f.say(vo.win); voLock(false);
  humOff();
  complete();
};

/* short countdown beep */
function beep(freq, len){
  const c = actx(); if(!c) return;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + (len || .2));
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + (len || .2) + .05);
}

/* ============================================================================================
   FLOW CONTROL
   ============================================================================================ */
let cur = -1, curPhase = null;
function setPrompt(t){ $("promptText").textContent = t || ""; }
function complete(){
  const nb = $("navBtn"); nb.disabled = false; nb.classList.add("active");
  disarmNudge();
  FLOW && FLOW.later(1500, () => nb.classList.add("nav-call"));
  FLOW && FLOW.later(6000, () => handAt(nb));
}
$("navBtn").addEventListener("click", () => {
  const nb = $("navBtn"); if(nb.disabled) return;
  sfx("sfx_next", .7); go(cur + 1);
});
function replay(){ if(FLOW && FLOW.replay && !document.body.classList.contains("vo-spk")) say(FLOW.replay); }
$("audioChip").onclick = replay;

async function phaseGate(phase){
  const line = PHASE_GATE[phase]; if(!line) return;
  const g = $("phaseGate"), t = $("phaseGateTitle"), img = $("phaseGateImg");
  img.src = "assets/peeking_talk_up.webp?r=" + Date.now();
  t.textContent = line.text; t.classList.remove("pg-pop"); void t.offsetWidth; t.classList.add("pg-pop");
  g.classList.remove("pg-sink"); g.classList.add("show", "pg-up");
  sfx("sfx_whoosh", .5);
  await Promise.all([say(line), new Promise(r => setTimeout(r, 1800))]);
  g.classList.add("pg-sink");
  await new Promise(r => setTimeout(r, 360));
  g.classList.remove("show", "pg-up", "pg-sink");
}

async function go(i){
  if(FLOW) FLOW.kill();
  stopVO(); disarmNudge(); closeKeypad(); hideHint(); voLock(false);
  $("stage").classList.remove("race-mode"); document.body.classList.remove("race-page");
  $("slideHost").innerHTML = "";
  const nb = $("navBtn"); nb.disabled = true; nb.classList.remove("active", "nav-call");
  if(i >= SLIDES.length){ return showEnd(); }
  document.body.classList.remove("is-end"); $("endScreen").classList.remove("show"); $("endBtn").classList.remove("show"); nb.classList.remove("hide");
  cur = i;
  const s = SLIDES[i];
  const f = FLOW = new Flow();
  if(s.phase !== curPhase){ curPhase = s.phase; await phaseGate(s.phase); if(f.dead) return; }
  const isTut = s.phase === "tutorial";
  $("stage").classList.remove("scene-classroom", "scene-terrace");
  if(s.scene) $("stage").classList.add("scene-" + s.scene);
  $("stage").classList.toggle("tut", isTut);
  document.body.classList.toggle("tut-page", isTut);
  setPrompt(s.prompt || ""); $("promptCount").classList.remove("show");
  setMood("talk");
  const ctx = {};
  if(isTut){
    const card = el("div", "tut-card");
    ctx.prompt = el("div", "tut-prompt"); ctx.content = el("div", "tut-content");
    const m = el("img", "tut-mascot"); m.src = "assets/UI/start_mascot.webp"; m.alt = "";
    const chip = el("span", "tut-audio", chipSVG("tut")); chip.setAttribute("role", "button"); chip.onclick = replay;
    card.append(ctx.prompt, ctx.content, m, chip);
    $("slideHost").appendChild(card);
  } else {
    ctx.content = $("slideHost");
  }
  try{ await R[s.type](ctx, s, f); }catch(e){ console.error(e); complete(); }
}

function showEnd(){
  if(FLOW) FLOW.kill();
  const f = FLOW = new Flow();
  document.body.classList.remove("tut-page"); $("stage").classList.remove("tut");
  document.body.classList.add("is-end");
  $("navBtn").classList.add("hide");
  $("endTitle").textContent = "शाबाश! अब आप 10 बनाकर जोड़-घटा सकते हैं!";
  $("endSubtitle").innerHTML = "पहले 10 बनाइए, फिर बाकी जोड़िए।<br>पहले 10 तक आइए, फिर बाकी घटाइए।";
  $("endScreen").classList.add("show");
  sfx("sfx_celebrate", .7); confettiCannon();
  say(VO_END).then(() => { if(!f.dead) $("endBtn").classList.add("show"); });
  f.later(9000, () => $("endBtn").classList.add("show"));
}
$("endBtn").onclick = () => { sfx("sfx_next", .7); location.href = location.pathname; };

/* ============================================================================================
   LANDING + BOOT
   ============================================================================================ */
function miniFrameSVG(filled, extra, dimmed){
  // a small ten frame: `filled` blue, `extra` yellow (moving in), `dimmed` outlines at the end
  let s = `<svg class="sg-mini" width="196" height="96" viewBox="0 0 196 96" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="190" height="90" rx="12" fill="#fff" stroke="#4F86D6" stroke-width="5"/>`;
  for(let i = 0; i < 10; i++){
    const x = 23 + (i % 5) * 37.5, y = 27 + Math.floor(i / 5) * 42;
    let fill = "#EEF4FC", stroke = "#C9D8EE", dash = "4 3";
    if(i < filled){ fill = "#6A9FE8"; stroke = "#fff"; dash = ""; }
    else if(i < filled + extra){ fill = "#FFC21A"; stroke = "#fff"; dash = ""; }
    if(dimmed && i >= 10 - dimmed){ fill = "#F3F3F3"; stroke = "#C8C8C8"; dash = "4 3"; }
    s += `<circle cx="${x}" cy="${y}" r="15" fill="${fill}" stroke="${stroke}" stroke-width="3" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
  }
  return s + "</svg>";
}
function buildLanding(){
  const hero = $("sgHero"); hero.parentElement.classList.add("land");
  hero.innerHTML = "";
  const scene = el("div", "sg-scene sg-title-art"); scene.setAttribute("role", "img"); scene.setAttribute("aria-label", "10 का जादू");
  hero.parentElement.prepend(scene);
}
let landingSpoken = false, landingSpeaking = false;
function speakLanding(){
  if(landingSpeaking) return Promise.resolve();
  landingSpeaking = true;
  return say(VO_LANDING).then(() => { landingSpeaking = false; landingSpoken = true; });
}
$("sgVo").onclick = () => { if(!landingSpeaking) speakLanding(); };
$("sgBtn").onclick = async () => {
  const b = $("sgBtn"); b.classList.add("sg-pressed"); sfx("sfx_play", .7); actx();
  if(!landingSpoken){ await speakLanding(); }          // the welcome line plays once, on the landing
  $("startGate").classList.add("hidden");
  document.body.classList.remove("is-start");
  go(0);
};
function preload(srcs){
  return Promise.race([
    Promise.all(srcs.map(s => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = s; }))),
    new Promise(r => setTimeout(r, 4000))
  ]);
}
function exportScript(){                    // QA helper: ?vo=csv downloads the VO script
  const rows = [["id","text","file"]].concat(Object.entries(VO_SCRIPT).map(([k, t]) => [k, t, "assets/VO/" + k + "." + VO_EXT]));
  return rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
}
window.exportScript = exportScript;
(async function boot(){
  buildLanding();
  await preload(["assets/UI/start_card.webp","assets/UI/startnew_bg_plain.webp","assets/UI/new_landing_swiftee_anim.webp",
                 "assets/swiftpal_buttons/btn-play-round.svg","assets/peeking_talk_up.webp","assets/Images/title_10ka_jadu.jpg","assets/UI/start_mascot.webp",
                 "assets/UI/sw_head_talking.webp","assets/UI/sw_head_celebrate_anim.webp","assets/UI/sw_head_tryagain_anim.webp","assets/UI/nudge_hand_new.svg"]);
  const bl = $("bootLoader"); bl.classList.add("done"); setTimeout(() => bl.remove(), 450);
  document.body.classList.add("loaded");
  const b = $("sgBtn"); b.classList.remove("sg-waiting"); b.classList.add("sg-appear");
  // QA jump
  const j = QS.get("slide");
  if(j != null){
    $("startGate").classList.add("hidden"); document.body.classList.remove("is-start");
    if(j === "end") return showEnd();
    const n = Math.max(0, Math.min(SLIDES.length - 1, parseInt(j, 10) || 0));
    curPhase = QS.has("gate") ? null : SLIDES[n].phase;
    go(n);
  }
})();

/* ---------- DEV NAV: ?dev or ?nav — jump to any slide, step, landing, end ---------- */
function buildDevNav(){
  if($("devNav")) return;
  const bar = el("div", "dev-nav"); bar.id = "devNav";
  const mk = (t, title) => { const b = el("button", "dev-nav-btn", t); b.title = title; return b; };
  const land = mk("⌂", "landing"), first = mk("⏮", "first"), prev = mk("◀", "prev"), next = mk("▶", "next"), end = mk("🎉", "celebration");
  const sel = el("select", "dev-nav-sel"); sel.title = "jump to slide";
  SLIDES.forEach((s, i) => { const o = el("option"); o.value = i; o.textContent = (i + 1) + ". " + s.id + " · " + s.type; sel.appendChild(o); });
  const lbl = el("span", "dev-nav-lbl");
  const leaveStart = () => { $("startGate").classList.add("hidden"); document.body.classList.remove("is-start"); document.body.classList.add("loaded"); const bl = $("bootLoader"); if(bl) bl.remove(); };
  const jump = i => { i = Math.max(0, Math.min(i, SLIDES.length - 1)); leaveStart(); curPhase = SLIDES[i].phase; go(i); sync(); };
  const sync = () => { const i = Math.max(0, cur); if(document.activeElement !== sel) sel.value = i;
    lbl.textContent = document.body.classList.contains("is-end") ? "end" : document.body.classList.contains("is-start") ? "landing" : (i + 1) + "/" + SLIDES.length + " · " + SLIDES[i].id; };
  land.onclick = () => location.href = location.pathname + "?dev";
  first.onclick = () => jump(0); prev.onclick = () => jump(cur - 1); next.onclick = () => jump(cur + 1);
  end.onclick = () => { leaveStart(); stopVO(); showEnd(); sync(); };
  sel.onchange = () => jump(parseInt(sel.value, 10));
  bar.append(land, first, prev, sel, lbl, next, end);
  document.body.appendChild(bar);
  setInterval(sync, 300); sync();
}
if(QS.has("dev") || QS.has("nav")) buildDevNav();
