/* FLN confetti kit (exact copy) */

/* FLN confetti - exact copy of the game build (MTG2A04_L02_S01 style.css). */

/* ===== FLN ANIMATION KIT: confetti BEGIN ===== */
.fx-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:60;}
.fx-confetti .p{position:absolute;top:0;left:var(--x);
  animation:cfFall var(--fall) linear var(--delay) both;}
/* Sway shares the rock's PERIOD and lags it by a quarter cycle. A fluttering plate
   slides in the direction it is tilted - the swing and the rock are one motion, not
   two independent ones. The negative delay is what creates the quarter-cycle lag. */
.fx-confetti .w{display:block;perspective:600px;
  animation:cfGlide var(--rockT) linear var(--delay) infinite both;}
.fx-confetti .f{display:block;position:relative;transform-style:preserve-3d;
  width:calc(var(--w) * var(--z));height:calc(var(--h) * var(--z));
  opacity:var(--dim,1);
  animation:cfRock var(--rockT) linear var(--delay) infinite both;}
/* the minority that actually goes end-over-end */
.fx-confetti .f.tum{animation:cfTumble var(--rockT) linear var(--delay) infinite both;}
/* two real faces: front bright, back the same hue darkened */
.fx-confetti .f::before,.fx-confetti .f::after{content:"";position:absolute;inset:0;
  border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.fx-confetti .f::before{background:var(--c);}
.fx-confetti .f::after{background:var(--c2);transform:rotateY(180deg);}
/* Shape mix. Sizes are deliberately far apart - at 7-11px a rectangle and a square are
   indistinguishable while tumbling, which makes the whole field read as "all squares". */
.fx-confetti .sq{--w:8px;  --h:8px;  border-radius:1px;}   /* square    1:1   */
.fx-confetti .rc{--w:6px;  --h:13px; border-radius:1px;}   /* rectangle 1:2.2 */
.fx-confetti .ln{--w:2.5px;--h:16px; border-radius:2px;}   /* line      1:6.4 */
.fx-confetti .st{--w:11px; --h:11px;}                      /* star - needs a few
                                 more px than the rest for its points to read */
/* clip-path goes on the FACES, not on .f - clip-path on .f would force
   transform-style to flat and kill the two-sided tumble */
.fx-confetti .st::before,.fx-confetti .st::after{
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,
                    50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}

/* LINEAR - terminal velocity. `both` is load-bearing: without it delayed pieces
   sit in a visible row on the top edge until their delay elapses.
   --drift gives each piece a gentle lean, as if in a faint air current. */
@keyframes cfFall{
  0%{transform:translate(0,-40px);opacity:0;}
  5%{opacity:1;}
  86%{opacity:1;}
  100%{transform:translate(var(--drift,0px),var(--dist,820px));opacity:0;}
}
/* GLIDE + BOB. Real flutter is NOT sinusoidal: the plate glides at near-constant
   attitude, then turns sharply. Long glide, quick reversal, linear timing - the
   keyframe percentages do the shaping.
   The Y term is vertical speed modulation: the plate falls SLOWER broadside during
   the glide (max drag) and quicker through the flip (edge-on, min drag). That
   hesitate-then-drop is what the eye reads as paper. */
@keyframes cfGlide{
  0%  {transform:translate(calc(var(--sway) * -1), 0);}
  45% {transform:translate(var(--sway), calc(var(--bob) * -1));}
  50% {transform:translate(var(--sway), 0);}
  95% {transform:translate(calc(var(--sway) * -1), calc(var(--bob) * -1));}
  100%{transform:translate(calc(var(--sway) * -1), 0);}
}
/* FLUTTER - the default, ~78% of pieces. Rocks about ONE axis, capped well short of
   edge-on, so the face stays toward the viewer. ease-in-out because a turning point
   is a turning point: it decelerates at max tilt, like any pendulum. */
/* FLIP. Holds attitude through the glide, then snaps over in 5% of the cycle.
   Phase-locked to cfGlide by construction - both start at the beginning of a glide,
   so no offset delay: the flip lands exactly on the direction reversal. */
@keyframes cfRock{
  0%  {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(var(--amp));}
  45% {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(calc(var(--amp) * 0.86));}
  50% {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(calc(var(--amp) * -1));}
  95% {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(calc(var(--amp) * -0.86));}
  100%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(var(--amp));}
}
/* TUMBLE - the other ~22%. One half revolution, face to face. The keyframes dwell
   near the faces and sweep through edge-on in 16% of the cycle, because a real plate
   hangs broadside where drag is highest and flips fast through the low-drag edge. */
@keyframes cfTumble{
  0%  {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(0deg);}
  42% {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(72deg);}
  58% {transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(108deg);}
  100%{transform:rotateZ(var(--tilt)) rotateY(var(--yaw)) rotateX(180deg);}
}
/* ===== FLN ANIMATION KIT: confetti END ===== */

/* ---- game level (MTG2A04_L02_S01): the layer covers the whole window; every piece is sized with the stage
   (--scale = min(window width / 1333, window height / 750) - set by confetti.js) at 1.5x the kit size ---- */
.fx-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5000;--fx-size:1.5;}
.fx-layer .fx-confetti .f{width:calc(var(--w) * var(--z) * var(--scale, 1) * var(--fx-size, 1));
  height:calc(var(--h) * var(--z) * var(--scale, 1) * var(--fx-size, 1));}

</style>

<script>
/* FLN animation kit — exact copy from the HI02H05_L02_S02 reference build */
/* ===== FLN ANIMATION KIT: preview-js BEGIN ===== */
(function(){ "use strict";
/* ===== FLN ANIMATION KIT: core BEGIN ===== */
(function(){ "use strict";
  var M = window.FLNMotion = window.FLNMotion || {};
  M.still = function(){
    try{ return document.documentElement.classList.contains("no-anim") ||
      (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
    catch(_){ return false; }
  };
  M.scale = function(){
    try{ return parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue("--scale")) || 1; }catch(_){ return 1; }
  };
  M.rect = function(r, sw){                    // screen rect -> stage coords (R1/R2)
    var s = M.scale();
    if(document.documentElement.classList.contains("rotated")){
      return { left:(r.top - sw.top)/s, top:(sw.right - r.right)/s, w:r.height/s, h:r.width/s };
    }
    return { left:(r.left - sw.left)/s, top:(r.top - sw.top)/s, w:r.width/s, h:r.height/s };
  };
  M.guard = function(fn){                      // R4
    try{ fn(); }catch(e){ try{ console.warn("[animation-kit]", e && e.message); }catch(_){} }
  };
  var _actx = null;
  M.audio = function(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
      _actx = _actx || new AC();
      if(_actx.state === "suspended") _actx.resume();
      return _actx;
    }catch(_){ return null; }
  };
  M.ready = function(fn){
    if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  };
})();
/* ===== FLN ANIMATION KIT: core END ===== */
/* R5, the JS half: the engine has no ?still=1 of its own - the string does not appear
   in it once - so PHASE 3 check 13c had nothing to switch off. This gives the kit flag
   something to bind to, and the reduced-motion CSS above does the rest. */
try{ if(/[?&]still=1/.test(location.search))
  document.documentElement.classList.add("no-anim"); }catch(e){}
  /* `cue` is the preview's sound trigger and the ONLY thing its effect code reaches for
     outside itself. Mapped onto the real recordings in assets/SFX. `sprinkle`
     shares sfx_burst on the kit's own instruction: burst fires on "every elements-burst
     moment: landing stars, the end-screen burst, and the correct-answer confetti". */
  var SFX = { correct:"sfx_correct", wrong:"sfx_wrong", burst:"sfx_burst",
              celebrate:"sfx_celebrate", sprinkle:"sfx_burst" };
  function cue(el, name){
    /* [H11-54] THIS LOADER WAS LEFT BEHIND BY THE FOLDER SPLIT. [H11-50] moved the effects to
       assets/SFX and taught audioDir() to _sfxFile and playSfx - but cue() is a THIRD loader,
       inside the kit block, with its own hard-coded folder, so every effect it plays (correct,
       wrong, burst, celebrate, sprinkle) has been asking for a file that is not there. Caught
       by logging a real match: the confetti burst requested assets/VO/sfx_burst.ogg.
       audioDir lives in a later script block, but cue() only ever runs on a user action, long
       after that block has parsed; the inline fallback covers the impossible case rather than
       letting a missing helper silence the effects a second time. */
    try{ var f = SFX[name]; if(!f) return;
         /* [H11-150] ONE SOUND PER MOMENT. A right answer asks for sfx_correct twice in the same
            tick - the engine's sfxCorrect() and this kit's tile confirm - and a wrong one asks for
            sfx_wrong twice the same way. Two copies of one clip started together play as one clip
            twice as loud, which the new SwiftPAL set (mastered to full scale) made audible. The
            second request inside 150ms is dropped; window.__sfxLast is shared with _sfxFile. */
         var _now = Date.now(), _last = (window.__sfxLast = window.__sfxLast || {});
         if(_last[f] && _now - _last[f] < 150) return; _last[f] = _now;
         var dir = (typeof audioDir === "function") ? audioDir(f)
                 : (f.indexOf("sfx_") === 0 ? "assets/SFX/" : "assets/VO/");
         var a = new Audio((typeof bustAudio==="function"?bustAudio(dir+f+".wav"):dir+f+".wav")); a.volume = 0.7;   /* [H11-156] WAV now */
         a.play().catch(function(){}); }catch(e){}
  }
var CONF = [
  ["#8B2FC9","#5E1C8C"],   /* violet */
  ["#3F51B5","#27358A"],   /* indigo */
  ["#1E88E5","#135FA6"],   /* blue   */
  ["#22B24C","#157A34"],   /* green  */
  ["#FFD21E","#D9A800"],   /* yellow */
  ["#FF8A1E","#C75F00"],   /* orange */
  ["#E5322D","#A81F1B"]    /* red    */
];

var COLORS = ["#FFE400","#FFBD00","#E89400","#FFCA6C","#FDFFB8"];

var HUES = ["#FCB717","#3B7DD8","#21A74A","#E5484D","#7048D6","#F1781D"];

var KIND = {s1:"k-star", s2:"k-star", s3:"k-spark", s4:"k-dot", s5:"k-dot"};

var SHAPES = ["st","st","st","st","rc","rc","ln","ln","sq","sq"];

var OL_ST = ["is-correct", "is-wrong", "is-muted"];

var SB_NEW = { stars:32, circles:8, startV:14, decay:0.975, ticks:150,
               shots:[0,220,440], spin:0.18, starScale:1.8, circleScale:1.0 };

function rnd(a, b){ return a + Math.random() * (b - a); }

function still(){
  try{ return document.documentElement.classList.contains("no-anim") ||
    (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch(e){ return false; }
}

function mk(cls){ var i = document.createElement("i"); i.className = cls; return i; }

function tempo(el){
  var cs = getComputedStyle(el);
  function num(p, d){
    var v = parseFloat(cs.getPropertyValue(p));
    if(!v && v !== 0) return d;
    return v > 20 ? v / 1000 : v;
  }
  var beat = num("--fx-beat", 0.4);
  return { beat: beat, reward: beat * (parseFloat(cs.getPropertyValue("--fx-reward")) || 2) };
}

function later(el, fn, ms){
  el._selT = el._selT || [];
  el._selT.push(setTimeout(fn, ms));
}

function selClear(el){
  if(el._selT){ for(var j = 0; j < el._selT.length; j++) clearTimeout(el._selT[j]); }
  el._selT = [];
  el.classList.remove("ck-correct", "wg-wrong", "wg-out", "wg-rel",
                      "old-correct", "old-wrong");
  var fx = el.querySelectorAll(".ck-fx,.wg-fx");
  for(var i = 0; i < fx.length; i++) fx[i].remove();
}

function ckPlay(el, o){
  o = o || {};
  var crown = (o.crown == null) ? 5 : o.crown;
  selClear(el);
  void el.offsetWidth;                        /* forced reflow - restarts the pop */
  var dur = o.dur || tempo(el).reward;        /* CSS owns the tempo */
  if(o.dur) el.style.setProperty("--ckT", dur + "s");

  var fx = mk("ck-fx");

  if(crown && !still()){
    var cr = mk("ck-crown");
    /* clientWidth is layout px INSIDE the scaled stage - i.e. design px already.
       getBoundingClientRect() here would come back multiplied by --scale (R1). */
    var w = el.clientWidth || 96, h = el.clientHeight || 96;
    var rx = w * 0.46, ry = h * 0.46;      /* the tile's own edge */
    for(var i = 0; i < crown; i++){
      var t = (crown === 1) ? 0.5 : i / (crown - 1);
      var a = (-158 + t * 136 + rnd(-7, 7)) * Math.PI / 180;   /* TOP arc only */
      var x0 = Math.cos(a) * rx, y0 = Math.sin(a) * ry;       /* start ON the edge */
      var out = rnd(.20, .34);                                /* ...and travel out */
      var s = mk("");
      s.style.cssText =
        "--ss:" + rnd(7, 12).toFixed(1) + "px;" +
        "--x0:" + x0.toFixed(1) + "px;" +
        "--y0:" + y0.toFixed(1) + "px;" +
        "--sx:" + (x0 + Math.cos(a) * w * out).toFixed(1) + "px;" +
        "--sy:" + (y0 + Math.sin(a) * h * out).toFixed(1) + "px;" +
        "--sr:" + Math.round(rnd(-140, 140)) + "deg;";
      cr.appendChild(s);
    }
    fx.appendChild(cr);
  }

  /* class FIRST - the border and pop must not wait on the decoration being built */
  el.classList.add("ck-correct");
  el.appendChild(fx);
  cue(el, "correct");
  /* Only the TRANSIENT layers are swept. .ck-correct stays: the green outline is
     the correct-mark and it belongs to the tile until the slide advances. */
  later(el, function(){
    var t = fx.querySelectorAll(".ck-crown");
    for(var i = 0; i < t.length; i++) t[i].remove();
  }, dur * 1050);
}

function wgPlay(el, o){

  var fx = mk("wg-fx");
  fx.appendChild(mk("wg-pulse"));
  el.appendChild(fx);

     switch animationend never fires and the tile would stay red forever - on
     exactly the devices least able to recover from it. (R5, second half.)

     transition with; see the CSS note. */

    el.classList.add("wg-rel");

function confettiNew(host, n){
  cue(host, "sprinkle");
  host.querySelectorAll(".fx-confetti").forEach(function(x){ x.remove(); });
  var dist = host.clientHeight + 60, maxLife = 0;
  var wrap = document.createElement("div");

    var z     = rnd(0.75, 1.15);           /* depth: nearer pieces are bigger */
    var fall  = rnd(1.1, 1.8) / z;         /* ...and fall faster (parallax)   */
    var delay = rnd(0, 0.35);
    if(fall + delay > maxLife) maxLife = fall + delay;
    var pair = CONF[i % CONF.length];
    /* Two regimes, and a real plate moves DIFFERENTLY in each:
       flutter = zigzags a lot, almost no net sideways drift;
       tumble  = autorotation produces a steady lateral force, so it barely zigzags
                 but drifts consistently to one side. */
    var flutter = Math.random() > 0.22;
    var rockT   = flutter ? rnd(0.6, 1.2) : rnd(0.75, 1.5);
    var sway    = flutter ? rnd(10, 34)   : rnd(2, 8);
    var drift   = flutter ? rnd(-12, 12)  : rnd(-45, 45);
    var bob     = flutter ? rnd(3, 7)     : rnd(2, 4);

      "--delay:" + delay.toFixed(2) + "s;" +
      "--drift:" + drift.toFixed(0) + "px;" +
      "--sway:"  + sway.toFixed(0) + "px;" +
      "--bob:"   + bob.toFixed(1) + "px;" +
      "--rockT:" + rockT.toFixed(2) + "s;" +
      /* capped short of 90deg: even at max tilt the face still reads */
      "--amp:"   + Math.round(rnd(28, 52)) + "deg;" +
      "--yaw:"   + Math.round(rnd(-30, 30)) + "deg;" +
      "--tilt:"  + Math.round(rnd(-25, 25)) + "deg;" +
      "--z:"     + z.toFixed(2) + ";" +
      "--dim:"   + (0.72 + (z - 0.75) / 0.4 * 0.28).toFixed(2) + ";" +
      "--c:"     + pair[0] + ";--c2:" + pair[1] + ";";

function starBurst(host, o){
  cue(host, "celebrate");
  host.querySelectorAll("canvas.fx").forEach(function(c){ c.remove(); });
  var W = host.clientWidth, H = host.clientHeight;
  var cv = document.createElement("canvas");
  cv.className = "fx"; cv.width = W; cv.height = H;
  cv.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
  host.insertBefore(cv, host.firstChild);
  var ctx = cv.getContext("2d"), parts = [];
  /* the real stage is 1333x750; scale velocity and size so the preview reads true */
  var k = W / 1333;
  var COLORS = ["#FFE400","#FFBD00","#E89400","#FFCA6C","#FDFFB8"];

  function starPath(r){
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var rad = (i % 2 === 0) ? r : r / 2, a = Math.PI / 5 * i - Math.PI / 2;
      ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
  }
  function add(n, scalar, shape){
    for(var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2;
      parts.push({ x:W/2, y:H*0.52, ax:Math.cos(a), ay:Math.sin(a),
        vel:o.startV * k * (0.5 + Math.random()), tick:0,
        scalar:scalar * k, shape:shape,
        color:COLORS[Math.floor(Math.random()*COLORS.length)],
        rot:Math.random()*Math.PI*2, spin:(Math.random()-.5)*o.spin });
    }
  }
  function shoot(){ add(o.stars, o.starScale, "star"); add(o.circles, o.circleScale, "circle"); }
  o.shots.forEach(function(ms){ ms ? setTimeout(shoot, ms) : shoot(); });

  /* derived from the LAST shot, so retiming the shots cannot end the loop early */
  var minFrames = Math.max.apply(null, o.shots) / 16 + 20;
  var frames = 0;
  (function frame(){
    ctx.clearRect(0, 0, W, H);
    var alive = false;
    for(var i = 0; i < parts.length; i++){
      var p = parts[i];
      if(p.tick >= o.ticks) continue;
      alive = true;
      p.x += p.ax*p.vel; p.y += p.ay*p.vel; p.vel *= o.decay;
      p.rot += p.spin; p.tick++;
      ctx.globalAlpha = 1 - p.tick/o.ticks;
      ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if(p.shape === "star"){ starPath(8*p.scalar); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0,0,6*p.scalar,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    frames++;
    if(alive || frames < minFrames) requestAnimationFrame(frame);
    else setTimeout(function(){ cv.remove(); }, 300);
  })();
}

function starPath(r){

      var rad = (i % 2 === 0) ? r : r / 2, a = Math.PI / 5 * i - Math.PI / 2;
      ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
    }

})();

(function(){ "use strict";
  var M = window.FLNMotion;

  function build(o){
    var sky = typeof o.container === "string" ? document.querySelector(o.container) : o.container;
    if(!sky) return null;
    sky.textContent = "";
    var maxSize = 0, frag = document.createDocumentFragment();

    o.layers.forEach(function(L, li){
      for(var i = 0; i < o.lanes; i++){
        var a = ((360 / o.lanes) * i + L.rot) * Math.PI / 180;
        var cos = Math.cos(a), sin = Math.sin(a);
        var size = +((o.size[0] + Math.random() * (o.size[1] - o.size[0])) * L.scale).toFixed(2);
        if(size > maxSize) maxSize = size;
        var dur = +(o.dur[0] + Math.random() * (o.dur[1] - o.dur[0])).toFixed(1);
        var el = document.createElement("i");
        el.className = o.shapes[(i + li) % o.shapes.length];
        el.style.cssText =
          "--s:"  + size + "vmax;" +
          "--x1:" + (o.r0 * cos).toFixed(2) + "vmax;--y1:" + (o.r0 * sin).toFixed(2) + "vmax;" +
          "--x2:" + (o.r1 * cos).toFixed(2) + "vmax;--y2:" + (o.r1 * sin).toFixed(2) + "vmax;" +
          "--t:"  + dur + "s;" +
          "--d:-" + (Math.random() * dur).toFixed(1) + "s;" +     // negative = de-sync
          "--g:"  + (o.glow[0] + Math.random() * (o.glow[1] - o.glow[0])).toFixed(1) + "s;" +
          "--gd:-" + (Math.random() * 4).toFixed(1) + "s;" +
          "--o:"  + (o.opacity[0] + Math.random() * (o.opacity[1] - o.opacity[0])).toFixed(2) + ";";
        frag.appendChild(el);
      }
    });
    sky.appendChild(frag);

    // collision proof: lane arc at the tightest radius must be >= 1.5x the largest element
    var arc = (2 * Math.PI * o.r0) / o.lanes, ok = arc >= maxSize * 1.5;
    if(!ok && o.warn !== false){
      console.warn("[animation-kit] sky lanes too tight: arc " + arc.toFixed(2) +
        "vmax vs element " + maxSize.toFixed(2) + "vmax. Reduce lanes or size.");
    }
    return { arc:arc, maxSize:maxSize, safe:ok, count:sky.children.length };
  }

  M.sky = {
    defaults: {
      container:".sg-sky", lanes:29,
      layers:[{rot:0,scale:1},{rot:6.2,scale:0.62},{rot:-6.2,scale:0.55}],
      r0:22, r1:72, size:[0.8,2.6], dur:[18,34], glow:[3.0,4.8],
      opacity:[0.62,0.92], shapes:["s1","s2","s3","s4","s5"], warn:true
    },
    init: function(opts){
      var o = Object.assign({}, this.defaults, opts || {}), res = null;
      M.guard(function(){ res = build(o); });
      return res;
    }
  };
  M.ready(function(){ M.guard(function(){ if(!window.__skyManual) M.sky.init(); }); });
})();

(function(){ "use strict";
  var M = window.FLNMotion;

  function boom(o){                      // sine thud + noise tail + square crackles
    var actx = M.audio(); if(!actx) return;
    try{
      var t = actx.currentTime, out = actx.createGain();
      out.gain.value = o.volume; out.connect(actx.destination);

      var tg = actx.createGain();
      tg.gain.setValueAtTime(0.9, t);
      tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      tg.connect(out);
      var osc = actx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, t);
      osc.frequency.exponentialRampToValueAtTime(90, t + 0.16);
      osc.connect(tg); osc.start(t); osc.stop(t + 0.18);

      var n = actx.sampleRate * 0.45;
      var buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
      for(var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
      var src = actx.createBufferSource(); src.buffer = buf;

      for(var c = 0; c < o.crackles; c++){
        var cg = actx.createGain(), ct = t + 0.10 + Math.random() * 0.30;
        cg.gain.setValueAtTime(0.0001, ct);
        cg.gain.exponentialRampToValueAtTime(0.18, ct + 0.006);
        cg.gain.exponentialRampToValueAtTime(0.0001, ct + 0.07);
        cg.connect(out);
        var co = actx.createOscillator();
        co.type = "square";
        co.frequency.setValueAtTime(1500 + Math.random() * 2200, ct);
        co.connect(cg); co.start(ct); co.stop(ct + 0.08);
      }
      var bp = actx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 3400; bp.Q.value = 0.8;
      var ng = actx.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.5, t + 0.03);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      src.connect(bp); bp.connect(ng); ng.connect(out); src.start(t + 0.02);
    }catch(_){}
  }

  function pop(el, r, o){
    el.classList.add("popped");
    // respawn on the next FLIGHT lap - the glow cycle is much shorter, so filter by name
    el.addEventListener("animationiteration", function back(e){
      if(e.animationName !== "sgFly") return;
      el.classList.remove("popped");
      el.removeEventListener("animationiteration", back);
    });

    var kind = "k-dot", cls = el.classList;
    for(var ci = 0; ci < cls.length; ci++){ if(o.kind[cls[ci]]) kind = o.kind[cls[ci]]; }

    var bs = Math.max(11, r.width);
    var b = document.createElement("div");
    b.className = "sg-burst " + kind;
    b.style.left = (r.left + r.width / 2) + "px";
    b.style.top  = (r.top  + r.height / 2) + "px";
    b.style.setProperty("--bs", bs + "px");
    b.appendChild(document.createElement("div")).className = "fl";

    var k = 0;
    for(var g = 0; g < o.rings.length; g++){
      var R = o.rings[g], off = Math.random() * Math.PI * 2;
      for(var i = 0; i < R.n; i++, k++){
        var a = off + i / R.n * Math.PI * 2;
        var dist = bs * R.rad * (0.78 + Math.random() * 0.44);
        var p = document.createElement("i");
        p.style.cssText =
          "--ps:"  + (bs * R.size * (0.8 + Math.random() * 0.5)).toFixed(1) + "px;" +
          "--dx:"  + (Math.cos(a) * dist).toFixed(1) + "px;" +
          "--dy:"  + (Math.sin(a) * dist).toFixed(1) + "px;" +
          "--gy:"  + (dist * o.gravity).toFixed(1) + "px;" +
          "--sd:"  + (R.dur + Math.random() * 0.22).toFixed(2) + "s;" +
          "--sdl:" + (Math.random() * 0.06).toFixed(3) + "s;" +
          "color:" + o.hues[k % o.hues.length];
        b.appendChild(p);
      }
    }
    document.body.appendChild(b);
    if(o.sound) boom(o);
    setTimeout(function(){ b.remove(); }, o.life);
  }

  M.skyBurst = {
    defaults: {
      container:".sg-sky", when:["is-start","is-end"],
      rings:[{n:9,rad:3.1,size:.58,dur:.80},{n:7,rad:1.8,size:.78,dur:.62}],
      hues:["#FCB717","#3B7DD8","#21A74A","#E5484D","#7048D6","#F1781D"],
      kind:{s1:"k-star",s2:"k-star",s3:"k-spark",s4:"k-dot",s5:"k-dot"},
      gravity:0.42, pad:12, padRatio:0.7, minAlpha:0.08, life:1200,
      sound:true, volume:0.22, crackles:4
    },
    init: function(opts){
      var o = Object.assign({}, this.defaults, opts || {});
      M.guard(function(){
        var sky = typeof o.container === "string"
          ? document.querySelector(o.container) : o.container;
        if(!sky) return;
        // capture phase: .sg-sky is pointer-events:none, so hit-test by rect (R6)
        document.addEventListener("pointerdown", function(e){
          if(M.still()) return;
          if(!o.when.some(function(c){ return document.body.classList.contains(c); })) return;
          var els = sky.querySelectorAll("i:not(.popped)");
          for(var i = 0; i < els.length; i++){
            var el = els[i], r = el.getBoundingClientRect();
            if(r.width < 2) continue;
            var pad = Math.max(o.pad, r.width * o.padRatio);   // ~4px targets need slack
            if(e.clientX < r.left - pad || e.clientX > r.right  + pad ||
               e.clientY < r.top  - pad || e.clientY > r.bottom + pad) continue;
            if(parseFloat(getComputedStyle(el).opacity) < o.minAlpha) continue;
            // claim the tap, or it also fires the button under the star
            e.stopPropagation(); e.preventDefault();
            pop(el, r, o);
            return;
          }
        }, true);
      });
    }
  };
  M.ready(function(){ M.guard(function(){ M.skyBurst.init(); }); });
})();

function idleCall(){
  const t = nudge.target; if(!t || !t.isConnected) return;
  const live = t.classList.contains("tf-ctr") ? [...document.querySelectorAll(".tf-ctr.live")] : [];
  (live.length ? live : [t]).forEach(e => { e.classList.remove("idle-call"); void e.offsetWidth; e.classList.add("idle-call"); setTimeout(() => e.classList.remove("idle-call"), 2500); });
  replay();
  const line = FLOW && FLOW.replay, len = line ? (VO_DUR[line.id] || 3) * 1000 : 0;
  nudge.timer = setTimeout(idleCall, nudge.ms + len);          // still nothing? ask again after the line + another wait
}
document.addEventListener("pointerdown", () => {           // any touch restarts the idle clock
  if(!nudge.target) return;
  clearTimeout(nudge.timer); nudge.timer = setTimeout(idleCall, nudge.ms);
}, true);
const NUDGE_MS = { tutorial:7000, guided:7000, practice:7000, game:7000 };   // 7 s of nothing → repeat the question

/* ============================================================================================
   TEN FRAME BOARD
   ============================================================================================ */
/* ---------- pacing (slow, child speed) ---------- */
const T = {
  move: 1600,       // one counter sliding into the frame / taking one away
  split: 1900,      // a group splitting in two
  near: 1900,       // the rest sliding up next to the ten
  beat: 700,        // a short look before the next step
  tap: 900          // hand flying to a counter before it taps
};

const C = 58, GAP = 12, PAD = 14, STEP = C + GAP, BW = 6;   // BW = frame border width (must match .tf-frame border)
const FW = PAD * 2 + 5 * C + 4 * GAP + BW * 2, FH = PAD * 2 + 2 * C + GAP + BW * 2;
const GROUP_GAP = 56;
class Board{
  /* opts: frame = counters already in the frame, loose = array of loose group sizes */
  constructor(host, opts){
    this.el = el("div", "tf-board");
    this.frameEl = el("div", "tf-frame"); this.frameEl.style.width = FW + "px"; this.frameEl.style.height = FH + "px";
    for(let i = 0; i < 10; i++){ const c = el("div", "tf-cell"); const p = this.cellPos(i); c.style.left = (p.x - BW) + "px"; c.style.top = (p.y - BW) + "px"; this.frameEl.appendChild(c); }
    this.el.appendChild(this.frameEl);
    this.frame = []; this.groups = []; this.near = !!opts.near;   // near: loose balls start right next to the tray
    for(let i = 0; i < (opts.frame || 0); i++) this.frame.push(this.mk());
    (opts.loose || []).forEach(n => { const g = []; for(let i = 0; i < n; i++) g.push(this.mk()); this.groups.push(g); });
    this.lblFrame = el("div", "tf-lbl"); this.el.appendChild(this.lblFrame);
    this.lblGroups = [];
    const looseMax = opts.maxLoose != null ? opts.maxLoose : this.looseWidth();
    this.width = FW + 80 + looseMax; this.el.style.width = this.width + "px"; this.lblGap = opts.lblGap || 36; this.el.style.height = (FH + 68 + this.lblGap) + "px";
    host.appendChild(this.el);
    this.layout(true);
    this.all().forEach((c, i) => {
      c.el.style.animationDelay = (i * 60) + "ms"; c.el.classList.add("enter");
      // drop the entry animation once it has played, so a later highlight ending can't replay it (balls popping in again)
      c.el.addEventListener("animationend", ev => { if(ev.animationName === "ctrIn"){ c.el.classList.remove("enter"); c.el.style.animationDelay = ""; } });
    });
  }
  mk(){ const e = el("div", "tf-ctr"); this.el.appendChild(e); const c = { el:e, dim:false }; e._ctr = c; return c; }
  all(){ return this.frame.concat(...this.groups); }
  cellPos(i){ return { x:BW + PAD + (i % 5) * STEP, y:BW + PAD + Math.floor(i / 5) * STEP }; }
  groupW(n){ return n ? Math.min(n, 5) * STEP - GAP : 0; }
  looseWidth(){ let w = 0, k = 0; this.groups.forEach(g => { if(g.length){ w += (k ? GROUP_GAP : 0) + this.groupW(g.length); k++; } }); return w; }
  looseX0(){ return this.near ? FW + 24 : FW + 80; }
  layout(instant){
    if(instant) this.el.classList.add("no-tr");
    this.frame.forEach((c, i) => { const p = this.cellPos(i); this.put(c, p.x, p.y); });
    let x = this.looseX0();
    this.groups.forEach((g, gi) => {
      g.forEach((c, i) => this.put(c, x + (i % 5) * STEP, BW + PAD + Math.floor(i / 5) * STEP));
      const w = this.groupW(g.length);
      const L = this.lblGroups[gi]; if(L) L.style.left = (x + w / 2) + "px";
      if(g.length) x += w + GROUP_GAP;
    });
    if(this._cx == null){                 // centre once, on the counters it starts with — never re-centre later
      const used = Math.max(FW, this.groups.some(g => g.length) ? x - GROUP_GAP : FW);
      this._cx = Math.round((this.width - used) / 2); this.el.style.translate = this._cx + "px 0";
    }
    this.lblFrame.style.left = (FW / 2) + "px"; this.lblFrame.style.top = (FH + this.lblGap) + "px";   // number tags sit a little below the tray
    this.lblGroups.forEach(L => L.style.top = (FH + this.lblGap) + "px");
    if(instant){ void this.el.offsetWidth; this.el.classList.remove("no-tr"); }
  }
  put(c, x, y){ c.x = x; c.y = y; c.el.style.transformOrigin = `${x + C / 2}px ${y + C / 2}px`; c.el.style.transform = `translate(${x}px,${y}px)`; }   // origin = the ball's own centre, so a highlight grows it in place
  labels(frameTxt, groupTxts){
    this.setLbl(this.lblFrame, frameTxt);
    (groupTxts || []).forEach((t, i) => {
      if(!this.lblGroups[i]){ const L = el("div", "tf-lbl"); this.el.appendChild(L); this.lblGroups[i] = L; }
      this.setLbl(this.lblGroups[i], t);
    });
    for(let i = (groupTxts || []).length; i < this.lblGroups.length; i++) this.setLbl(this.lblGroups[i], "");
    this.layout();
  }
  setLbl(L, t){ t = t == null ? "" : String(t); if(L.textContent === t) return; L.textContent = t; L.classList.remove("pop"); void L.offsetWidth; if(t) L.classList.add("pop"); }
  split(sizes){
    const flat = [].concat(...this.groups); this.groups = []; let k = 0;
    sizes.forEach(n => { this.groups.push(flat.slice(k, k + n)); k += n; });
    this.layout();
  }
  groupOf(c){ return this.groups.findIndex(g => g.includes(c)); }
  toFrame(c){
    const gi = this.groupOf(c); if(gi < 0 || this.frame.length >= 10) return false;
    this.groups[gi].splice(this.groups[gi].indexOf(c), 1);
    this.frame.push(c); this.layout();
    return true;
  }
  setNear(on){ this.near = on; this.layout(); }
  allGood(){ this.undimmed(this.all()).forEach((c, i) => setTimeout(() => { c.el.classList.remove("hl"); c.el.classList.add("good"); }, i * 50)); }   // the answer: every ball still counted turns green
  dim(c){ c.dim = true; c.el.classList.add("dim"); c.el.classList.remove("live","good"); }
  live(list, on){ list.forEach(c => c.el.classList.toggle("live", on)); }
  hlFrame(ms){ this.frameEl.classList.remove("hl"); void this.frameEl.offsetWidth; this.frameEl.classList.add("hl"); this.hlList(this.undimmed(this.frame), ms); }
  /* highlight = the balls brighten and pulse gently where they are; they never move */
  hlList(list, ms){ list.forEach(c => { c.el.classList.remove("hl"); void c.el.offsetWidth; c.el.classList.add("hl"); clearTimeout(c._hlT); c._hlT = setTimeout(() => c.el.classList.remove("hl"), ms || 2400); }); }
  undimmed(list){ return list.filter(c => !c.dim); }
  cellEl(i){ return this.frameEl.children[i]; }

  /* drag (or tap) loose counters into the frame */
  /* making 10 is tap-only everywhere (no dragging): tap a loose ball and it slides into the next empty cell */
  enableTapMove(list, onMove){
    this.live(list, true);
    list.forEach(c => {
      c.el.onpointerdown = ev => {
        if(!c.el.classList.contains("live") || document.body.classList.contains("vo-lock") || this.frame.length >= 10) return;
        ev.preventDefault(); c.el.onpointerdown = null; c.el.classList.remove("live");
        this.toFrame(c); sfx("sfx_seat", .6); onMove && onMove(c);
      };
    });
  }
  enableTap(list, onTap){
    this.live(list, true);
    list.forEach(c => {
      c.el.onpointerdown = ev => {
        if(!c.el.classList.contains("live") || document.body.classList.contains("vo-lock")) return;
        ev.preventDefault(); c.el.onpointerdown = null;
        this.dim(c); sfx("sfx_tap", .6); onTap && onTap(c);
      };
    });
  }
  freeze(){ this.all().forEach(c => { c.el.classList.remove("live"); c.el.onpointerdown = null; }); }
  /* a see-through copy flies from a loose counter to the next empty cell (guided demo) */
  ghost(c){
    const g = el("div", "tf-ctr ghost"); this.el.appendChild(g);
    g.style.transform = `translate(${c.x}px,${c.y}px)`;
    const p = this.cellPos(this.frame.length);
    requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transform = `translate(${p.x}px,${p.y}px)`; }));
    setTimeout(() => { g.style.opacity = "0"; }, 1600);
    setTimeout(() => g.remove(), 2100);
  }
}

/* equation  a ± b = [box] */
function Equation(host, a, op, b, small){
  const e = el("div", "eq" + (small ? " small" : ""));
  const parts = [a, op === "-" ? MINUS : "+", b, "="].map(t => { const s = el("span", "eq-part", String(t)); e.appendChild(s); return s; });
  const box = el("div", "eq-box", "?"); e.appendChild(box); host.appendChild(e);
  return {
    el:e, box, parts,
    set(v, cls){ box.textContent = v; box.className = "eq-box" + (cls ? " " + cls : ""); },
    /* cues (for Flow.say) that light each part of "8 + 5 = 13" exactly when the voice says it.
       spec = [[part, fromMs, toMs], ...], part 0..4 = first number, sign, second number, "=", answer box.
       The times are measured from the recording, so they follow the spoken order (e.g. "13 में से 5 घटाने…"). */
    partCues(spec){
      const items = parts.concat([box]), out = [];
      spec.forEach(([i, from, to]) => { const p = items[i]; out.push([from, () => p.classList.add("say")], [to, () => p.classList.remove("say")]); });
      return out;
    }
  };
}
/* the single sub-equation line under the counters */
function SubEq(host){
  const e = el("div", "sub-eq"); host.appendChild(e);
  return {
    el:e,
    show(text, cls){ e.innerHTML = ""; e.appendChild(el("span", "se" + (cls ? " " + cls : ""), text)); },
    add(text, cls){ if(e.children.length) e.appendChild(el("span", "arr", "→")); e.appendChild(el("span", "se" + (cls ? " " + cls : ""), text)); },
    clear(){ e.innerHTML = ""; }
  };
}

function openKeypad(label){
  return new Promise(resolve => {
    const ov = $("kpOverlay"); ov.innerHTML = "";
    const box = el("div", "kp-box");
    const close = el("button", "kp-close", "×"); close.setAttribute("aria-label", "बंद करें");
    const eqRow = el("div", "eq small"); eqRow.innerHTML = label.map(t => `<span class="eq-part">${t}</span>`).join("");
    const disp = el("div", "eq-box ready", ""); disp.style.animation = "none"; eqRow.appendChild(disp);
    const grid = el("div", "kp-grid"); grid.setAttribute("role", "group"); grid.setAttribute("aria-label", "संख्या कीपैड"); let val = "";
    const ok = el("button", "kp-key ok", "✓"); ok.disabled = true;
    const render = () => { disp.textContent = val; ok.disabled = !val; };
    ["1","2","3","4","5","6","7","8","9","0"].forEach(d => {
      const k = el("button", "kp-key", d); k.type = "button"; k.setAttribute("aria-label", d);
      k.onclick = () => { sfx("sfx_tap", .5); if(val.length < 2) val += d; render(); };
      grid.appendChild(k);
    });
    const del = el("button", "kp-key del", "⌫"); del.onclick = () => { val = val.slice(0, -1); render(); };
    del.type = ok.type = "button";
    del.setAttribute("aria-label", "मिटाएँ"); ok.setAttribute("aria-label", "उत्तर जमा करें");
    grid.insertBefore(del, grid.lastElementChild); grid.appendChild(ok);
    ok.onclick = () => { if(!val) return; ov.classList.remove("show"); resolve(parseInt(val, 10)); };
    close.onclick = () => { ov.classList.remove("show"); resolve(null); };
    box.append(close, eqRow, grid); ov.appendChild(box); ov.classList.add("show");
  });
}
function closeKeypad(){ $("kpOverlay").classList.remove("show"); }

function showHint(text){ $("hintText").textContent = text || ""; $("hintVisual").innerHTML = ""; $("hintOverlay").classList.add("show"); $("stage").classList.toggle("blurred", !$("stage").classList.contains("race-mode")); return $("hintVisual"); }

/* reusable animations: "make 10 then add the rest" / "come down to 10 then take away the rest" */
async function animAdd(flow, host, a, b, line){
  const need = 10 - a, rest = b - need;
  const board = new Board(host, { frame:a, loose:[b], maxLoose: 5 * STEP + (need && rest >= 5 ? STEP + GROUP_GAP : 0), lblGap:12 });
  board.labels(a, [b]);
  const sub = SubEq(host);
  await flow.wait(T.beat * 2);
  board.split([need, rest]); board.labels(a, [need, rest]);
  await flow.wait(T.split);
  for(const c of board.groups[0].slice()){ board.toFrame(c); sfx("sfx_seat", .5); await flow.wait(T.move); }
  board.labels(10, ["", rest]);
  await flow.wait(T.beat * 2);
  board.setNear(true);
  await flow.wait(T.near);

  if(line) await flow.say(line); else await flow.wait(1500);
  return board;
}
async function animSub(flow, host, n, m, line){
  const loose = n - 10, rest = m - loose;
  const board = new Board(host, { frame:10, loose:[loose], lblGap:12 });
  board.labels(10, [loose]);
  const sub = SubEq(host);
  await flow.wait(T.beat * 2);
  for(const c of board.groups[0]){ board.dim(c); sfx("sfx_tap", .5); await flow.wait(T.move * .7); }
  board.labels(10, [""]);
  await flow.wait(T.beat * 2);
  for(let i = 9; i > 9 - rest; i--){ board.dim(board.frame[i]); sfx("sfx_tap", .5); await flow.wait(T.move * .7); }
  board.labels(10 - rest, [""]); board.frame.slice(0, 10 - rest).forEach(c => c.el.classList.add("good"));

  if(line) await flow.say(line); else await flow.wait(1500);
  return board;
}

/* always-visible keypad on the right (reference MTG2A01_L04_S01 layout): digits fill the answer box, ✓ submits */
function Pad(host){
  const wrap = el("div", "pv-pad off closed"); wrap.setAttribute("role", "group"); wrap.setAttribute("aria-label", "संख्या कीपैड"); host.appendChild(wrap);
  const BACK = '<svg viewBox="0 0 60 40" fill="none"><path d="M20 6h32a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H20L5 21z" fill="#9E1B22" transform="translate(-2 3)"/><path d="M20 4h32a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H20L5 19z" fill="#fff"/><path d="M28 12l13 13M41 12L28 25" stroke="#E12A33" stroke-width="5.5" stroke-linecap="round"/></svg>';
  const OK = '<svg viewBox="0 0 48 40" fill="none"><path d="M8 23l11 11L41 10" stroke="#0D7A2E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 3)"/><path d="M8 21l11 11L41 8" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const keys = ["1","2","3","4","5","6","7","8","9","back","0","ok"].map(k => {
    const b = el("button", "pv-key" + (k === "back" ? " pv-back" : k === "ok" ? " pv-ok" : ""), k === "back" ? BACK : k === "ok" ? OK : k);
    b.dataset.k = k; b.type = "button";
    b.setAttribute("aria-label", k === "back" ? "मिटाएँ" : k === "ok" ? "उत्तर जमा करें" : k);
    wrap.appendChild(b); return b;
  });
  let val = "", target = null, resolve = null, only = null, onKey = null;
  const show = () => { if(target){ target.textContent = val || "?"; target.classList.toggle("typing", !!val); } };
  keys.forEach(b => b.onclick = () => {
    if(wrap.classList.contains("off") || !resolve) return;
    const k = b.dataset.k;
    if(only && k !== only) return;                       // guided hint: only the key the hand points at works
    const step = onKey; onKey = null;
    if(k === "back") val = val.slice(0, -1);
    else if(k === "ok"){ if(!val) return; const r = resolve; resolve = null; const n = parseInt(val, 10); val = ""; if(step) step(); r(n); return; }
    else if(val.length < 2) val += k;
    sfx("sfx_tap", .5); show();
    if(step) step();
  });
  return {
    el:wrap,
    on(v){ wrap.classList.toggle("off", !v); },
    open(){ if(!wrap.classList.contains("closed")) return; wrap.classList.remove("closed"); wrap.classList.add("opening"); sfx("sfx_tap", .5); },
    read(box){ target = box; val = ""; show(); return new Promise(r => { resolve = r; }); },
    /* last hint: the hand shows each key of the answer in turn (e.g. 14 → "1", then "4", then ✓);
       every other key is locked until it is pressed */
    guide(seq){
      return new Promise(done => {
        const next = i => {
          if(i >= seq.length){ only = null; keys.forEach(b => b.classList.remove("locked")); hideHand(); done(); return; }
          only = seq[i]; const kb = keys.find(b => b.dataset.k === only);
          keys.forEach(b => b.classList.toggle("locked", b !== kb));
          handAt(kb);
          onKey = () => { hideHand(); next(i + 1); };
        };
        next(0);
      });
    }
  };
}
/* answer box + keypad + hint ladder (PDF p8, p9) */
async function answerLadder(f, eq, label, ans, vo, hint2){
  eq.box.classList.add("ready");
  let wrong = 0;
  if(!f.pad) armNudge(eq.box, NUDGE_MS.practice);
  while(true){
    let v;
    if(f.pad){
      if(f.pad.el.classList.contains("closed")){            // tap the "?" first — then the keypad opens
        armNudge(eq.box, NUDGE_MS.practice);
        await f.until(done => { eq.box.onclick = () => { if(!document.body.classList.contains("vo-lock")){ eq.box.onclick = null; done(); } }; });
        disarmNudge(); f.pad.open();
        await f.wait(450);
      }
      f.pad.on(true); armNudge(f.pad.el, NUDGE_MS.practice);
      v = await f.gate(f.pad.read(eq.box));
      f.pad.on(false); disarmNudge();
    } else {
      await f.until(done => { eq.box.onclick = () => { if(!document.body.classList.contains("vo-lock")) done(); }; });
      disarmNudge();
      v = await f.gate(openKeypad(label));
    }
    if(v == null){ armNudge(eq.box, NUDGE_MS.practice); continue; }
    if(v === ans){
      eq.box.onclick = null; eq.set(ans, "done"); sfx("sfx_correct"); confettiCannon(); setMood("happy");
      voLock(true); await f.wait(400); await f.say(vo.ok); voLock(false);
      return;
    }
    wrong++;
    eq.set(v, "wrong"); sfx("sfx_wrong", .5); setMood("tryagain");
    voLock(true);
    await f.wait(500);
    if(wrong === 1){ await f.say(VO_RETRY); }
    else if(wrong === 2){ setMood("hint"); eq.set("?", ""); await hint2(); }
    else if(f.pad){
      // last hint: say the answer, then the hand walks the child through typing it — no answer filled in for them
      eq.box.onclick = null; await f.wait(400);
      await f.say(vo.h3); voLock(false);
      eq.set("?", "ready"); f.pad.on(true);
      const typed = f.gate(f.pad.read(eq.box));
      await f.gate(f.pad.guide([...String(ans), "ok"]));
      await typed; f.pad.on(false);
      eq.set(ans, "done"); sfx("sfx_correct"); confettiCannon(); setMood("happy");
      voLock(true); await f.wait(400); await f.say(vo.ok); voLock(false);
      return;
    }
    else {
      eq.box.onclick = null; await f.wait(400);
      eq.set(ans, "done"); sfx("sfx_correct", .5);
      await f.say(vo.h3); voLock(false);
      return;
    }
    voLock(false);
    eq.set("?", "ready");
    if(!f.pad) armNudge(eq.box, NUDGE_MS.practice);
  }
}

/* PDF p9 — P2 16 − 8: 6 loose first (frame locked), then any 2 from the frame, then type 8 */
R.practiceSub = async (ctx, s, f) => {
  const { n, m, vo } = s, loose = n - 10, rest = m - loose;
  const top = el("div", "q-wrap pv-layout"); ctx.content.appendChild(top);
  const eq = Equation(top, n, "-", m);
  const pvRow = el("div", "pv-row"); top.appendChild(pvRow); const pvLeft = el("div", "pv-left"); pvRow.appendChild(pvLeft);
  f.pad = Pad(pvRow);
  const board = new Board(pvLeft, { frame:10, loose:[loose], maxLoose: 5 * STEP, near:true });
  const sub = SubEq(pvLeft);
  f.replay = vo.q;
  board.labels(10, [loose]);
  voLock(true); await f.wait(900);
  await f.say(vo.q, [[.12, () => { board.hlFrame(1200); board.hlList(board.groups[0], 1200); }]]);   // "16": the whole 16 lights together
  voLock(false);
  await f.until(done => {
    let k = 0;
    board.enableTap(board.groups[0].slice(), () => { k++; board.labels(10, [loose - k || ""]); if(k === loose) done(); });
    armNudge(board.groups[0][0].el, NUDGE_MS.practice);
  });
  disarmNudge();
  await f.wait(T.beat);
  sfx("sfx_correct", .45);
  await f.until(done => {                                        // the frame unlocks only now
    let k = 0;
    board.enableTap(board.frame.slice(), () => { k++; board.labels(10 - k, [""]); if(k === rest){ board.freeze(); done(); } });
    armNudge(board.frame[9].el, NUDGE_MS.practice);
  });
  disarmNudge();
  await f.wait(T.beat);
  await answerLadder(f, eq, [n, MINUS, m, "="], n - m, vo, async () => {
    board.hlList(board.groups[0]);
    await f.wait(1400); board.hlList(board.frame.filter(c => c.dim && !board.groups[0].includes(c)));
    await f.wait(1400); board.hlList(board.undimmed(board.frame));
    await f.say(vo.h2);
    await f.wait(T.beat);
  });
  board.undimmed(board.frame).forEach(c => c.el.classList.add("good"));
  complete();
};

/* PDF p10, p11 — choose the answer. Wrong 1: retry. Wrong 2: counters appear on this screen and
   animate, then the question comes back. Wrong 3: correct one glows, the others go inactive. */
R.mcq = async (ctx, s, f) => {
  $("stage").classList.add("no-next");                  // MCQ: no Next button — it moves on by itself after the right answer
  const { a, b, op, vo } = s, ans = op === "+" ? a + b : a - b;
  const wrap = el("div", "q-wrap"); ctx.content.appendChild(wrap);
  const eq = Equation(wrap, a, op, b);
  const stageEl = el("div", "mcq-stage"); wrap.appendChild(stageEl);
  const grid = el("div", "opt-grid"); stageEl.appendChild(grid);
  const cells = s.options.map(v => { const c = el("div", "opt-cell", `<span class="num-glyph">${v}</span>`); c.dataset.v = v; grid.appendChild(c); return c; });
  f.replay = vo.q;
  voLock(true); await f.wait(700);
  // P4 says "…इस डिब्बे में आने वाली…": the box pulses on those words; P3 has no "डिब्बे", it just lights on "सही … संख्या"
  await f.say(vo.q, [[s.op === "-" ? .56 : .58, () => { eq.box.classList.add("ready"); if(s.op === "-") eq.box.classList.add("call"); }]]);
  eq.box.classList.remove("ready", "call");
  voLock(false);
  let wrong = 0;
  while(true){
    armNudge(eq.box, NUDGE_MS.practice);      // never point at an option — that would give the answer away
    const cell = await f.until(done => cells.forEach(c => c.onclick = () => { if(!document.body.classList.contains("vo-lock")) done(c); }));
    disarmNudge();
    if(+cell.dataset.v === ans){
      cells.forEach(c => c.onclick = null);
      cell.classList.remove("reveal-pulse"); cell.classList.add("correct"); eq.set(ans, "done");
      sfx("sfx_correct"); confettiCannon(); setMood("happy");
      cells.filter(c => c !== cell).forEach(c => c.classList.add("faded"));
      voLock(true); await f.wait(400); await f.say(vo.ok); voLock(false);
      break;
    }
    wrong++; sfx("sfx_wrong", .5); setMood("tryagain");
    cell.classList.remove("wrong-flash"); void cell.offsetWidth; cell.classList.add("wrong-flash");
    voLock(true);
    await f.wait(600);
    if(wrong === 1){ await f.say(VO_RETRY); }
    else if(wrong === 2){
      cell.classList.remove("wrong-flash");
      setMood("hint");
      grid.classList.add("away");                                   // counters appear temporarily
      const h = el("div", "mcq-hint"); stageEl.appendChild(h);
      if(op === "+") await animAdd(f, h, a, b, vo.h2); else await animSub(f, h, a, b, vo.h2);
      await f.wait(800);
      // the hint stays where it is, just a bit smaller, and the options come back underneath it
      stageEl.classList.add("with-hint"); h.classList.add("mini"); grid.classList.remove("away");
      await f.wait(500);
    } else {
      cell.classList.remove("wrong-flash");
      const kept = stageEl.querySelector(".mcq-hint"); if(kept) kept.classList.add("no-lbl");
      cells.forEach(c => { if(+c.dataset.v === ans) c.classList.add("reveal-pulse"); else c.classList.add("faded"); });
      await f.say(vo.h3);
    }
    voLock(false);
    cell.classList.remove("wrong-flash");
  }
  await f.wait(1200); go(cur + 1);
};

/* ---------- PDF p12 — गणित की तेज़ दौड़ (designer art: dock + ocean backgrounds, jet ski cut-outs) ---------- */
const JR = [   // player order as in the PDF: 1 blue, 2 red, 3 yellow, 4 green
  { name:"खिलाड़ी 1", c:"blue" }, { name:"खिलाड़ी 2", c:"red" }, { name:"खिलाड़ी 3", c:"yellow" }, { name:"खिलाड़ी 4", c:"green" }
];
const JR_VP = { x:666, y:328 };                        // horizon of race_ocean.jpg on the 1333x750 stage
function jrWater(layer, getSpeed){
  const sepB = [-560, 190, 666, 1142, 1890];           // lane separators where they meet the bottom edge
  const items = [];
  sepB.forEach((xb, i) => { for(let k = 0; k < 3; k++){ const e = el("div", "jr-buoy"); layer.appendChild(e); items.push({ e, xb, z:2 + k * 4 + (i % 2) * 2, foam:false }); } });
  for(let k = 0; k < 16; k++){ const e = el("div", "jr-foam"); layer.appendChild(e); items.push({ e, xb:-200 + Math.random() * 1733, z:1 + Math.random() * 11, foam:true }); }
  let last = performance.now(), alive = true;
  const step = now => {
    if(!alive) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const sp = getSpeed();
    items.forEach(it => {
      it.z -= sp * dt;
      if(it.z < .85){ it.z += 12; if(it.foam) it.xb = -200 + Math.random() * 1733; }
      const t = 1 / it.z, y = JR_VP.y + (750 - JR_VP.y) * t, x = JR_VP.x + (it.xb - JR_VP.x) * t;
      it.e.style.transform = `translate(${x}px,${y}px) scale(${Math.max(.05, t)})`;
      it.e.style.opacity = t < .12 ? t / .12 : 1;
    });
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return () => { alive = false; };
}

  const pop = el("div", "jt-pop"); world.appendChild(pop);
  const LANES = [333, 555, 777, 999], Y0 = 286, Y1 = 112;

  const powerMeter = el("div", "jr-power", '<svg viewBox="0 0 24 32" aria-hidden="true"><path d="M14 1 3 18h8l-1 13L22 12h-9Z"/></svg><div class="jr-leds">' + [0,1,2,3,4].map(i => `<i style="--segment:${i};height:${12+i*4}px"></i>`).join("") + '</div>');
  powerMeter.setAttribute("aria-hidden", "true"); panel.appendChild(powerMeter);
  const band = el("div", "jr-band"); panel.appendChild(band);
  const btnRow = el("div", "jr-btns"); panel.appendChild(btnRow);
  const btns = [0, 1, 2].map(() => { const b = el("button", "jr-btn"); btnRow.appendChild(b); return b; });
  const setProg = p => {
    const completed = Math.round(p * questionCount);
    fill.style.height = (p * 100) + "%"; icon.style.bottom = (p * 100) + "%";
    dots.forEach((d, i) => d.classList.toggle("done", completed >= i + 1));
    bar.setAttribute("aria-valuenow", String(completed));
  };
  setProg(0);
  panel.style.visibility = "hidden";

  /* 3-2-1-GO! */
  const cd = el("div", "jt-count"); world.appendChild(cd);
  if(!QUICK) for(const t of ["3", "2", "1"]){
    cd.textContent = t; cd.classList.remove("go", "show"); void cd.offsetWidth; cd.classList.add("show");
    beep(520); await f.wait(800);
  }
  cd.textContent = "चलो!"; cd.classList.remove("show"); void cd.offsetWidth; cd.classList.add("show", "go");
  beep(880, .35); vroom(2); setSpeed(4.5);
  jets.forEach(j => { j.p = 0; j.target = 0; j.v = 0; });
  await f.wait(700); cd.remove();
  panel.style.visibility = "";
  world.dataset.raceState = "racing";

  const qs = QUICK ? [] : RACE_QS.slice().sort(() => Math.random() - .5), total = qs.length;   // ?win = QA: skip straight to the finish
  if(!QUICK){ voLock(true); await f.say(vo.go); voLock(false); }
  let streak = 0;
  for(let qi = 0; qi < total; qi++){
    const q = qs[qi];
    band.innerHTML = "";
    const eq = Equation(band, q.a, q.op, q.b);
    const vals = q.opts.slice().sort(() => Math.random() - .5);
    btns.forEach((b, i) => { b.textContent = vals[i]; b.dataset.v = vals[i]; b.className = "jr-btn"; b.onclick = null; });
    setSpeed(4.2);
    voLock(true); await f.say(q.vo); voLock(false);
    let wrong = 0;
    thinking = true;
    while(true){
      armNudge(eq.box, NUDGE_MS.game);
      const btn = await f.until(done => btns.forEach(o => o.onclick = () => { if(!document.body.classList.contains("vo-lock")) done(o); }));
      disarmNudge();
      if(+btn.dataset.v === q.ans){
        thinking = false;
        btns.forEach(o => o.onclick = null);
        btn.classList.remove("reveal-pulse"); btn.classList.add("correct"); eq.set(q.ans, "done");
        if(wrong === 0) streak++; else streak = 0;
        const lvl = Math.max(1, Math.min(3, streak));                     // 1 small boost · 2 faster · 3 turbo
        sfx("sfx_correct", .6); vroom(lvl);
        setSpeed([0, 5.8, 7.2, 9.2][lvl]);
        meJ.el.classList.remove("boost", "turbo", "slow"); void meJ.el.offsetWidth;
        meJ.el.classList.add(lvl >= 3 ? "turbo" : "boost");
        meJ.kick = .13 + lvl * .045;                                  // a short personal boost
        meJ.target = (qi + 1) / total;
        // Rivals keep their own pace; a right answer boosts Swifty rather than braking everyone else.
        setProg(meJ.target);
        // All boost effects stay on the player's jet ski.
        popText("शाबाश!");
        voLock(true); await f.say(VO_RACE_OK[Math.min(lvl - 1, VO_RACE_OK.length - 1)]); voLock(false);
        await f.wait(900);
        meJ.el.classList.remove("boost", "turbo");
        break;
      }
      // wrong: the streak breaks, the engine sputters, our jet ski drops back and the others edge past
      wrong++; streak = 0; setSpeed(2.3);
      btn.classList.remove("wrong-flash"); void btn.offsetWidth; btn.classList.add("wrong-flash");
      sfx("sfx_wrong", .45); engineDown();
      meJ.el.classList.remove("boost", "turbo", "slow"); void meJ.el.offsetWidth; meJ.el.classList.add("slow");
      meJ.kick = -.12; // Swifty loses a little ground, while the water and opponents keep moving.
      // Opponents keep their normal cruising speed on a wrong answer as well.
      voLock(true);
      await f.wait(700);
      if(wrong === 1){
        btn.classList.remove("wrong-flash"); btn.classList.add("crossed");
        thinking = false;
        const host = showHint(`${q.a} ${q.op === "+" ? "+" : MINUS} ${q.b}`);     // the counters pop out
        if(q.op === "+") await animAdd(f, host, q.a, q.b, VO_RACE_HINT_ADD); else await animSub(f, host, q.a, q.b, VO_RACE_HINT_SUB);
        await f.wait(1200); hideHint();
        await f.wait(400);
        thinking = true;
      } else {
        btn.classList.remove("wrong-flash");
        btns.forEach(o => { if(+o.dataset.v === q.ans) o.classList.add("reveal-pulse"); else o.classList.add("faded"); });
        await f.say(q.voAns);
      }
      setSpeed(4.2);
      voLock(false);
    }
  }
  /* 4. Cross the line, then track the winner in the same race scene. */
  thinking = false; finishing = true; world.dataset.raceState = "finishing";
  disarmNudge(); hideHint(); panel.remove();
  setSpeed(9.2); vroom(3); shake();
  meJ.target = 1.25; meJ.v += .4; meJ.el.classList.add("turbo");
  rivals.forEach(r => { r.kick = 0; });
  setProg(1);
  await f.wait(850);
  const line = el("div", "jt-finish"); world.appendChild(line);
  finish = { el:line, y:-110 };
  await f.wait(1200);
  alive = false; humOff();
  await finishSprites.ready;
  if(f.dead) return;
  const calm = !!(window.FLNMotion && FLNMotion.still());
  const victory = el("div", "race-victory");
  const camera = el("div", "victory-camera"); victory.appendChild(camera);
  // Move the live water, finish line and racers together: no scene replacement.
  camera.appendChild(sea); camera.appendChild(line);
  jets.forEach(j => { camera.appendChild(j.el); j.el.classList.remove("turbo", "boost"); });
  const anchor = { x:meJ.x, y:Y0 - meJ.p * (Y0 - Y1) + 91 };
  const rivalDepartures = rivals.map(j => ({
    jet:j, x:j.x + (j._w || 0), y:Y0 - j.p * (Y0 - Y1)
  }));
  camera.style.transformOrigin = `${anchor.x}px ${anchor.y}px`;
  victory.appendChild(el("div", "victory-title", 'आप जीत गए!'));
  world.appendChild(victory); world.classList.add("victory-mode");
  world.dataset.raceState = "victory-camera";
  // Use the original illustrated Swifty and selected jet-ski artwork.
  world.dataset.finishRenderer = finishSprites.canvas.dataset.renderer;
  victory.appendChild(meJ.el);
  meJ.el.querySelector(".jr-tag").remove();
  meJ.img.style.transform = "";
  const hero = finishSprites.canvas;
  victory.appendChild(hero);
  const trail = el("canvas", "victory-trails"); trail.width = STAGE_W; trail.height = STAGE_H;
  victory.appendChild(trail);
  const trailCtx = trail.getContext("2d");
  let previousTail = null, victoryAlive = true;
  const victoryStart = performance.now();
  const killRace = f.kill.bind(f);
  f.kill = () => { victoryAlive = false; killRace(); };
  const smooth = v => { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
  const lowerDuration=1.5,turnDuration=4.4,turnEnd=lowerDuration+turnDuration;
  // Short, smooth acceleration/deceleration with a steady speed through the turn.
  const turnProgress = elapsed => {
    const duration=turnDuration, ramp=.9, speed=1/(duration-ramp);
    const easeIn = t => speed*(t/2-ramp/(2*Math.PI)*Math.sin(Math.PI*t/ramp));
    if(elapsed<=0) return 0;
    if(elapsed>=duration) return 1;
    if(elapsed<ramp) return easeIn(elapsed);
    if(elapsed>duration-ramp) return 1-easeIn(duration-elapsed);
    return speed*(elapsed-ramp/2);
  };
  let turnSfx = false;
  function victoryFrame(now, forceT){
    if(!victoryAlive || f.dead) return;
    const t = forceT != null ? forceT : calm ? turnEnd+1 : (performance.now() - victoryStart) / 1000;
    const lower = smooth(t / lowerDuration);
    const circle = turnProgress(t - lowerDuration);
    const front = smooth((t - turnEnd) / .7);
    // First lower the camera. Its angle stays fixed throughout the single boat turn.
    camera.style.transform = `translate(${(666-anchor.x)*lower}px,${(360-anchor.y)*lower}px) rotateX(${lower*34}deg) scale(${1+lower*.55})`;
    camera.style.setProperty("--victory-flow", ((flow+Math.min(t,lowerDuration)*24)%1024)+"px"); // water rests while the jet ski turns (lighter, smoother frames)
    if(lower<1){
      sea.style.backgroundPositionY = (flow + t*24) + "px";
      waterSurface.style.backgroundPositionY = (flow + t*24 + 24) + "px";
      animateWater(raceTime + t);
    }
    sea.style.opacity = String(1-lower);
    line.style.opacity = String(1 - lower);
    // Rivals keep travelling forward and leave through the top during the zoom.
    // Keep the complete craft and wake opaque throughout this camera movement.
    const departure = smooth(t / 2.4);
    rivalDepartures.forEach(({jet,x,y}) => {
      jet.el.style.opacity = "1";
      jet.el.style.transform = `translate(${x}px,${y - (STAGE_H+240)*departure}px)`;
    });
    const angle = circle*Math.PI*2;
    // Gentle camera tracking brings the last point of the loop to the front/centre.
    const x = 666 - circle*180 + Math.cos(angle)*180;
    const y = 360 + circle*100 + Math.sin(angle)*100;
    const boatX = anchor.x + (x-anchor.x)*lower;
    const boatY = anchor.y + (y-anchor.y)*lower;
    const tangent = Math.atan2(-180*Math.sin(angle), -100*Math.cos(angle))*180/Math.PI;
    const facing = 180 + Math.atan2(180*Math.sin(angle),100*Math.cos(angle))*180/Math.PI + (circle>.5?360:0);
    const reveal = smooth((t-.55)/1);
    const spriteScale = .65 + (Math.sin(angle)+1)*.125 + circle*.125;
    meJ.el.style.transform = `translate(${boatX}px,${boatY-91}px) scale(${1+lower*.5})`;
    meJ.el.style.opacity = String(1-reveal);
    finishSprites.draw(facing);
    hero.style.left = boatX + "px"; hero.style.top = (boatY-90*spriteScale) + "px";
    hero.style.opacity = String(reveal);
    hero.style.transform = `rotate(${Math.sin(angle)*4*circle*(1-circle)*(1-front)}deg) scale(${spriteScale})`;
    victory.dataset.circleDegrees = (circle*360).toFixed(2);
    victory.dataset.cameraLowered = lower.toFixed(3);
    if(trailCtx && !calm && t<9){
      trailCtx.globalCompositeOperation = "destination-out";
      trailCtx.fillStyle = "rgba(0,0,0,.018)"; trailCtx.fillRect(0,0,STAGE_W,STAGE_H);
      trailCtx.globalCompositeOperation = "source-over";
      if(t>lowerDuration && t<turnEnd){
        const r=tangent*Math.PI/180;
        const tail={x:boatX-Math.sin(r)*100,y:boatY+Math.cos(r)*100};
        if(previousTail && Math.hypot(tail.x-previousTail.x,tail.y-previousTail.y)<60){
          trailCtx.beginPath();trailCtx.moveTo(previousTail.x,previousTail.y);trailCtx.lineTo(tail.x,tail.y);
          trailCtx.strokeStyle="rgba(235,253,255,.55)";trailCtx.lineWidth=16;trailCtx.lineCap="round";trailCtx.stroke();
        }
        previousTail=tail;
      }
    }
    if(!calm && !turnSfx && t >= lowerDuration - .1){ turnSfx = true; sfx("sfx_win_turn", .8); }   // engine rev + water churn + swirl, timed to the 4.4 s turn
    if(t>=turnEnd+.55 && world.dataset.raceState!=="complete" && !victory.classList.contains("portrait")){
      victory.classList.add("portrait"); world.dataset.raceState="victory-portrait";
      if(!calm){ sfx("sfx_win_trophy", .75); setTimeout(() => sfx("sfx_win_applause", .55), 250); setTimeout(() => sfx("sfx_win_yay", .6), 450); }
    }
    // The turn ends exactly once; then the scene is still (the loop runs only until the wake trail has faded).
    if(!calm && forceT == null && t < 9) requestAnimationFrame(victoryFrame);
  }
  requestAnimationFrame(victoryFrame);
  sfx("sfx_celebrate", .7);
  voLock(true); f.replay = vo.win;
  const winVoice = f.say(vo.win);
  await f.wait(calm ? 100 : Math.round(turnEnd*1000)+650);
  if(!victory.classList.contains("portrait")) victoryFrame(0, turnEnd + .6);   // safety: always end on the final pose + banner
  sfx("sfx_burst", .5); confettiCannon();
  if(!calm) f.later(1300, () => confettiCannon());   // a second burst keeps the party going
  // The Next button must always come: wait for the win line, but never longer than 3 s after the title.
  await Promise.race([Promise.all([winVoice, f.wait(calm ? 700 : 650)]), f.wait(3000)]);
  if(calm) victoryAlive = false;
  voLock(false); world.dataset.raceState = "complete";
  // No Next button on the win screen: enjoy the celebration, then move on to the last screen by itself.
  await f.wait(calm ? 1500 : 3000);
  if(f.dead) return;
  window.go(cur + 1);   // (the race has its own local "go" Play button)
};

/* short countdown beep */
function beep(freq, len){
  const c = actx(); if(!c) return;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + (len || .2));
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + (len || .2) + .05);
}

function miniFrameSVG(filled, extra, dimmed){
  // a small ten frame: `filled` blue, `extra` yellow (moving in), `dimmed` outlines at the end
  let s = `<svg class="sg-mini" width="196" height="96" viewBox="0 0 196 96" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="190" height="90" rx="12" fill="#fff" stroke="#4F86D6" stroke-width="5"/>`;
  for(let i = 0; i < 10; i++){
    const x = 23 + (i % 5) * 37.5, y = 27 + Math.floor(i / 5) * 42;
    let fill = "#EEF4FC", stroke = "#C9D8EE", dash = "4 3";
    if(i < filled){ fill = "#6A9FE8"; stroke = "#fff"; dash = ""; }
    else if(i < filled + extra){ fill = "#FFC21A"; stroke = "#fff"; dash = ""; }
    if(dimmed && i >= 10 - dimmed){ fill = "#F3F3F3"; stroke = "#C8C8C8"; dash = "4 3"; }
    s += `<circle cx="${x}" cy="${y}" r="15" fill="${fill}" stroke="${stroke}" stroke-width="3" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
  }
  return s + "</svg>";
}
function buildLanding(){

function speakLanding(){

    if(VO_LANDING.heard || landGestured){ landingSpoken = true; $("sgVo").classList.remove("sg-vo-call"); showPlay(); }

}

  await preload(["assets/UI/start_card.webp","assets/UI/startnew_bg_plain.webp","assets/UI/new_landing_swiftee_anim.webp",
                 "assets/swiftpal_buttons/btn-play-round.svg","assets/peeking_talk_up.webp","assets/Images/title_10ka_jadu.jpg","assets/UI/start_mascot.webp",
                 "assets/UI/sw_head_talking.webp","assets/UI/sw_head_celebrate_anim.webp","assets/UI/sw_head_tryagain_anim.webp","assets/UI/nudge_hand_new.svg","assets/Images/last_swifty_happy.webp","assets/Images/last_swifty_shabaash.webp","assets/Images/last_swifty_talk.webp"]);
  const bl = $("bootLoader"); bl.classList.add("done"); setTimeout(() => bl.remove(), 450);
  document.body.classList.add("loaded");
  if(QS.get("slide") == null) setTimeout(speakLanding, 500);      // Swifty greets; Play appears when she has finished
  if(QS.has("tap")) setTimeout(() => window.dispatchEvent(new Event("pointerdown")), 1500);   // QA only: simulate the first tap
  // QA jump
  const j = QS.get("slide");
  if(j != null){
    $("startGate").classList.add("hidden"); document.body.classList.remove("is-start");
    if(j === "end") return showEnd();
    const n = Math.max(0, Math.min(SLIDES.length - 1, parseInt(j, 10) || 0));
    curPhase = QS.has("gate") ? null : SLIDES[n].phase;
    go(n);
  }
})();

/* ---------- DEV NAV: ?dev or ?nav — jump to any slide, step, landing, end ---------- */
function buildDevNav(){
  if($("devNav")) return;
  const bar = el("div", "dev-nav"); bar.id = "devNav";
  const mk = (t, title) => { const b = el("button", "dev-nav-btn", t); b.title = title; return b; };
  const land = mk("⌂", "landing"), first = mk("⏮", "first"), prev = mk("◀", "prev"), next = mk("▶", "next"), win = mk("🏆", "win screen (आप जीत गए!)"), end = mk("🎉", "last screen");
  const sel = el("select", "dev-nav-sel"); sel.title = "jump to slide";
  SLIDES.forEach((s, i) => { const o = el("option"); o.value = i; o.textContent = (i + 1) + ". " + s.id + " · " + s.type; sel.appendChild(o); });
  [["win", "🏆 WIN · आप जीत गए!"], ["end", "🎉 LAST · end screen"]].forEach(([v, t]) => { const o = el("option"); o.value = v; o.textContent = t; sel.appendChild(o); });
  const raceIdx = Math.max(0, SLIDES.findIndex(s => s.type === "race"));
  const openWin = () => location.href = location.pathname + "?dev&slide=" + raceIdx + "&win";
  const openEnd = () => { leaveStart(); stopVO(); showEnd(); sync(); };
  const lbl = el("span", "dev-nav-lbl");
  const leaveStart = () => { $("startGate").classList.add("hidden"); document.body.classList.remove("is-start"); document.body.classList.add("loaded"); const bl = $("bootLoader"); if(bl) bl.remove(); };
  const jump = i => { i = Math.max(0, Math.min(i, SLIDES.length - 1)); if(QS.has("win")){ location.href = location.pathname + "?dev&slide=" + i; return; } leaveStart(); curPhase = SLIDES[i].phase; go(i); sync(); };
  const sync = () => { const i = Math.max(0, cur); if(document.activeElement !== sel) sel.value = document.body.classList.contains("is-end") ? "end" : QS.has("win") && document.body.classList.contains("race-page") ? "win" : i;
    lbl.textContent = document.body.classList.contains("is-end") ? "last screen" : QS.has("win") && document.body.classList.contains("race-page") ? "win screen" : document.body.classList.contains("is-start") ? "landing" : (i + 1) + "/" + SLIDES.length + " · " + SLIDES[i].id; };
  land.onclick = () => location.href = location.pathname + "?dev";
  first.onclick = () => jump(0); prev.onclick = () => jump(cur - 1); next.onclick = () => jump(cur + 1);
  win.onclick = openWin; end.onclick = openEnd;
  sel.onchange = () => sel.value === "win" ? openWin() : sel.value === "end" ? openEnd() : jump(parseInt(sel.value, 10));
  bar.append(land, first, prev, sel, lbl, next, win, end);
  document.body.appendChild(bar);
  setInterval(sync, 300); sync();
}
if(QS.has("dev") || QS.has("nav")) buildDevNav();
</script>
