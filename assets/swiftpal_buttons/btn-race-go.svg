      <stop offset="0" stop-color="#9BF77F"/><stop offset=".55" stop-color="#3CCB4C"/><stop offset="1" stop-color="#1F9E35"/>
    </radialGradient>
    <pattern id="chk" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff"/><rect width="4" height="4" fill="#1B2433"/><rect x="4" y="4" width="4" height="4" fill="#1B2433"/>
    </pattern>
  </defs>
  <circle cx="80" cy="92" r="66" fill="#127A27"/>
  <circle cx="80" cy="84" r="66" fill="url(#g)"/>
  <circle cx="80" cy="84" r="66" fill="none" stroke="#fff" stroke-width="7"/>
  <ellipse cx="62" cy="50" rx="30" ry="15" fill="#fff" opacity=".45" transform="rotate(-25 62 50)"/>
  <circle cx="104" cy="44" r="5" fill="#fff" opacity=".7"/>
  <path d="M66 58 Q60 54 60 61 V107 Q60 114 66 110 L108 88 Q114 84 108 80 Z" fill="#127A27" opacity=".45" transform="translate(4 5)"/>
  <path d="M66 58 Q60 54 60 61 V107 Q60 114 66 110 L108 88 Q114 84 108 80 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <g transform="translate(118 14) rotate(14)">
