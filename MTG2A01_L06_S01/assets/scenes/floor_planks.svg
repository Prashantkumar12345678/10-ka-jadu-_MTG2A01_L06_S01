<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240" height="90" preserveAspectRatio="none">
  <!-- T3's wooden floor. Review 2026-09-30: "better floor, not too distracting" - light oak, three rows of planks (22 / 30
       / 38: a little perspective), seams only a shade darker than the wood, no grain, the planks' tones barely apart.
       Seams staggered and two rows wrap round the tile's edge, so the repeat never lines up. Stretched to the floor's
       height, repeated across it. -->
  <g stroke="none">
    <rect x="0" y="0" width="100" height="22" fill="#E2C39C"/><rect x="100" y="0" width="120" height="22" fill="#DEBF97"/><rect x="220" y="0" width="20" height="22" fill="#E2C39C"/>
    <rect x="0" y="22" width="40" height="30" fill="#DDBC94"/><rect x="40" y="22" width="130" height="30" fill="#E3C59F"/><rect x="170" y="22" width="70" height="30" fill="#DDBC94"/>
    <rect x="0" y="52" width="60" height="38" fill="#DCBB92"/><rect x="60" y="52" width="130" height="38" fill="#E1C29B"/><rect x="190" y="52" width="50" height="38" fill="#DCBB92"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M100 0V22M220 0V22M40 22V52M170 22V52M60 52V90M190 52V90" stroke="#C7A47B" stroke-width="1"/>
